[[headers]]
  for = "/*.js"
  [headers.values]
    Access-Control-Allow-Origin = "https://illysito.webflow.io"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://illysito.webflow.io"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
