[[headers]]
  for = "/*.js"
  [headers.values]
     Access-Control-Allow-Origin = "https://illyalukianov.com"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
     Access-Control-Allow-Origin = "https://illyalukianov.com"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
